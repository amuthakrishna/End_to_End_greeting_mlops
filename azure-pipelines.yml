trigger:
- prod-ci

pool:
  name: Default

variables:
  - group: aws_credentials
  - group: github_token

stages:

# =====================================================
# CD STAGE
# =====================================================
- stage: CD
  displayName: "Deploy Model"

  jobs:
  - job: deploy
    displayName: "Deploy Latest Model"
    steps:

    - script: |
        set -e

        echo "Deploying latest model from S3..."

        # -----------------------------------
        # Clone repo
        # -----------------------------------
        git clone https://$(GITHUB_TOKEN)@github.com/amuthakrishna/End_to_End_greeting_mlops_CD.git -b prod-cd
        cd End_to_End_greeting_mlops_CD

        REPO_DIR=$(pwd)
        K8S_DIR="$REPO_DIR/k8s"

        mkdir -p "$K8S_DIR"

        echo "Repo dir: $REPO_DIR"
        echo "K8S dir: $K8S_DIR"

        # -----------------------------------
        # STEP 1: Get latest model safely
        # -----------------------------------
        LATEST_MODEL=$(aws s3 ls s3://greeting-model-s3/models/ \
          | sort | tail -n 1 | awk '{print $4}')

        # Clean hidden characters
        LATEST_MODEL=$(echo "$LATEST_MODEL" | tr -d '\r\n\t ')

        echo "Latest model: [$LATEST_MODEL]"

        if [ -z "$LATEST_MODEL" ]; then
          echo "ERROR: No model found in S3"
          exit 1
        fi

        # -----------------------------------
        # STEP 2: Download directly as stable name (NO rename step)
        # -----------------------------------
        LOCAL_MODEL_PATH="$K8S_DIR/intent_model.pkl"

        aws s3 cp "s3://greeting-model-s3/models/$LATEST_MODEL" "$LOCAL_MODEL_PATH"

        echo "Downloaded model to: $LOCAL_MODEL_PATH"

        # -----------------------------------
        # STEP 3: Validate file exists
        # -----------------------------------
        if [ ! -f "$LOCAL_MODEL_PATH" ]; then
          echo "ERROR: Model download failed"
          exit 1
        fi

        ls -lah "$K8S_DIR"

        # -----------------------------------
        # STEP 4: Extract model version
        # -----------------------------------
        MODEL_VERSION=$(echo "$LATEST_MODEL" | sed 's/intent_model_//' | sed 's/.pkl//')

        echo "Model Version: $MODEL_VERSION"

        # -----------------------------------
        # STEP 5: Update Kubernetes YAML
        # -----------------------------------
        sed -i "s/REPLACE_MODEL_VERSION/$MODEL_VERSION/g" "$K8S_DIR/inference.yaml"

        echo "Updated inference.yaml"

        # -----------------------------------
        # STEP 6: Git commit (optional but safe)
        # -----------------------------------
        git config user.email "amuthakrishna1988@gmail.com"
        git config user.name "amuthakrishna"

        git add k8s/intent_model.pkl k8s/inference.yaml

        git commit -m "Deploy latest model $MODEL_VERSION" || echo "No changes to commit"
        git push origin prod-cd

        echo "Deployment completed successfully"

      displayName: "Deploy Latest Model from S3"